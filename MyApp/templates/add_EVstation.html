<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add EV Stations</title>

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div>
        <h3>Add EV Stations</h3><br><br>

        {% if messages %}
    {% for message in messages %}
        <div class="alert alert-danger">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div>
                <label>Name</label>
                <input type="text" name="name" placeholder="Station Name">
                <br><br>

                <label>Phone</label>
                <input type="text" name="phone" placeholder="Phone">
                <br><br>

                <label>Email</label>
                <input type="email" name="email" placeholder="Email">
                <br><br>

                <label>Latitude</label>
                <input type="number" step="any" name="latitude" placeholder="Latitude">
                <br><br>

                <label>Longitude</label>
                <input type="number" step="any" name="longitude" placeholder="Longitude">
                <br><br>

                <label>Photo</label>
                <input type="file" name="photo">
                <br><br>

                <button type="submit" class="btn btn-success">Add Station</button>
            </div>
        </form>
    </div>
</body>
</html>
