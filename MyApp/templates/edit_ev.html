<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit EV Station</title>

      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{data.id}}">
            <div>
                <label>Name</label>
                <input type="text" name="name" value="{{data.name}}">
                <br><br>

                <label>Phone</label>
                <input type="text" name="phone" value="{{data.phone}}">
                <br><br>

                <label>Email</label>
                <input type="email" name="email" value="{{data.email}}">
                <br><br>

                <label>Latitude</label>
                <input type="number" step="any" name="latitude" value="{{data.latitude}}">
                <br><br>

                <label>Longitude</label>
                <input type="number" step="any" name="longitude" value="{{data.longitude}}">
                <br><br>

                <label>Photo</label>
                <img src="{{data.photo}}" style="width: 100px; height: 100px;">
                <input type="file" name="photo" value="{{data.photo}}">
                <br><br>

                <button type="submit" class="btn btn-success">SAVE</button>
            </div>
        </form>
    </div>
</body>
</html>
