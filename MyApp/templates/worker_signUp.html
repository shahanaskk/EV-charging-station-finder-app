<!DOCTYPE html>
<head>
    <title>Worker Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>



</head>

<body style="background-color: rgb(7, 23, 197);">
    <div class="container">
        <div class="mt-4" style="margin-left: 100px;">
            <h3 style="color: aliceblue;">Sign Up</h3>
            <div class="mt-4" style="background-color: rgb(127, 254, 122); padding-left: 350px;" >
                <form action="/sign_upPost/" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input type="hidden" name="id">
                 <div class="row mb-3">
                    <label for="name"  class=" col-form-label-sm">Name </label>
                    <div class="col-sm-5">
                    <input type="text" name="name" class="form-control" required><br>
                    <span></span>
                    </div>
                 </div>

                 <div class="row mb-3">
                    <label for="photo"  class=" col-form-label-sm">Photo </label>
                    <div class="col-sm-5">
                    <input type="file" name="photo" class="form-control" required>
                    <span></span>  <br>
                    </div>
                 </div>

                 <div class="row mb-3">
                    <label>Phone </label>
                    <div class="col-sm-5">
                    <input type="text" name="phone" class="form-control" required>
                    <span></span><br>
                    </div>
                 </div>
                 
                 <div class="row mb-3">
                   <label>Email </label>
                    <div class="col-sm-5">
                    <input type="text" name="email" class="form-control" required>
                    {% if message %}
                    <span>{{message}}</span><br>
                    {% endif %}
                    </div>
                 </div>   

                 <div class="row mb-3">
                   <label>specialization  </label>
                    <div class="col-sm-5">
                    <select>
                        <option></option>
                    </select>
                    <span></span><br>
                    </div>
                 </div>   

                 <div class="row mb-3">
                   <label>Vehicle Name </label>
                    <div class="col-sm-5">
                    <input type="text" name="vehicle_name" class="form-control" required>
                    <span></span><br>
                    </div>
                 </div>   

                 <div class="row mb-3">
                   <label>Vehicle Number </label>
                    <div class="col-sm-5">
                    <input type="text" name="vehicle_number" class="form-control" required>
                    <span></span><br>
                    </div>
                 </div>   

                 <div class="row mb-3">
                    <label>Password </label>
                    <div class="col-sm-5">
                    <input type="password" name="password" class="form-control" required>
                    <span></span><br>
                    </div>
                 </div>   

                 <div class="row mb-3">
                    <label>Confirm Password </label>
                    <div class="col-sm-5">
                    <input type="password" name="Confirm" class="form-control" required>
                    <span></span><br>
                    </div>  
                 </div>   

                 
                 <button style="margin-left: 100px;" type="submit" class="btn btn-primary" >Sign Up</button>
                </form>
            </div>

        </div>

    </div>
</body>
